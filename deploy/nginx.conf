# ==============================================================================
# Nginx-Konfiguration für HWG Ludwigshafen Intranet-Server
# ==============================================================================

# Variante A: Nginx als Webserver für das Standalone-Dashboard
server {
    listen 80;
    server_name compliance.hwg-lu.de formulare-check.intern.hwg-lu.de;

    root /var/www/compliance_dashboard;
    index compliance_dashboard.html index.html;

    # Maximale Upload-Größe für große XFP-Formulardateien
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /compliance_dashboard.html;
    }

    # Optional: Gzip-Kompression für schnellste Ladezeiten
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}

