# ==============================================================================
# Nginx-Konfiguration für HWG Ludwigshafen Intranet-Server
# ==============================================================================

# Variante B (Empfohlen für Produktivbetrieb): Nginx als Reverse Proxy vor dem Docker-Container (Port 8080)
server {
    listen 80;
    server_name compliance.hwg-lu.de formulare-check.intern.hwg-lu.de;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

