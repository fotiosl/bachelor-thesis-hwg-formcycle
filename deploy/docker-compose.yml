version: '3.8'

services:
  hwg-compliance-dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: hwg-formcycle-checker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    security_opt:
      - no-new-privileges:true
    read_only: false
